<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>my-web</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <script src="weather.js" defer></script>
  </head>
  <body>
    <header>
      <h1>조윤재의 웹 연습장</h1>
      <nav>
        <a href="index.html">홈</a>
        <a href="about.html">내 정보</a>
        <a href="guestbook.html">방명록</a>
      </nav>
    </header>
    <main>
      <div class="card" id="greeting">인사말을 준비 중입니다.</div>
      <div>
        <button id="hello-button" type="button">인사 바꾸기</button>
        <button id="dark-button" type="button">다크 모드</button>
      </div>
      <div class="card" id="count">클릭 0회</div>
      <h2>현재 기온</h2>
      <div class="card">
        <label for="city">도시 선택</label>
        <select id="city">
          <option value="seoul">서울</option>
          <option value="jeonju">전주</option>
          <option value="iksan">익산</option>
        </select>
        <button id="run-button" type="button">기온 조회</button>
        <p id="output" aria-live="polite">도시를 선택하고 기온 조회를 눌러 주세요.</p>
      </div>
      <h2>소개</h2>
      <img src="images/profile.png" alt="조윤재의 프로필 그림" width="160">
      <p class="card">웹프로그래밍을 배우는 <strong>조윤재</strong>입니다.</p>
      <p class="card">이 페이지는 수업 시간에 한 주씩 늘려 갑니다.</p>
      <h2>취미</h2>
      <ul class="card">
        <li>사진 찍기</li>
        <li>보드게임</li>
        <li>저녁 산책</li>
      </ul>
    </main>
    <footer>
      <p>수업용 연습 페이지 · 조윤재</p>
    </footer>
  </body>
</html>
